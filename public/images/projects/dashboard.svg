    <rect x="496.5" y="284.5" width="207" height="141" rx="17.5" fill="none" stroke="#2a1020" stroke-opacity="0.08" />
    <text x="516" y="312" font-size="10" font-weight="600" fill-opacity="0.7">Tenggat terdekat</text>

