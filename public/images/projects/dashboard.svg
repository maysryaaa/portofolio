<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Ilustrasi contoh antarmuka Dashboard Manajemen Tugas">
  <title>Ilustrasi contoh antarmuka Dashboard Manajemen Tugas</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd0d9" />
      <stop offset="0.55" stop-color="#fc8eac" />
      <stop offset="1" stop-color="#ef7d9d" />
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.88" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f79ab1" />
      <stop offset="1" stop-color="#dd6288" />
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#5c1836" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" />
  <circle cx="90" cy="440" r="170" fill="#ffffff" opacity="0.16" />

  <g filter="url(#sh)">
    <rect x="66" y="52" width="668" height="396" rx="26" fill="url(#win)" />
    <rect x="66.5" y="52.5" width="667" height="395" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.72" />
  </g>

  <path d="M66 96 H734" stroke="#2a1020" stroke-opacity="0.12" />
  <g fill="#2a1020" opacity="0.28">
