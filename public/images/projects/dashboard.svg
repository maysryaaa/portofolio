      <rect x="158" y="352" width="22" height="52" rx="6" />
      <rect x="196" y="362" width="22" height="42" rx="6" />
      <rect x="234" y="330" width="22" height="74" rx="6" />
      <rect x="272" y="344" width="22" height="60" rx="6" />
      <rect x="310" y="318" width="22" height="86" rx="6" />
      <rect x="348" y="336" width="22" height="68" rx="6" />
