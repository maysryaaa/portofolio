  <text x="718" y="478" text-anchor="end" font-family="'Hanken Grotesk', Arial, sans-serif" font-size="8" font-weight="600" letter-spacing="2" fill="#2a1020" fill-opacity="0.4">ILUSTRASI CONTOH</text>
